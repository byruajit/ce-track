# Generated by the release script from the session kit's requirements.txt. Do not edit by hand.
[project]
name = "ce-track"
version = "0.1.0"
description = "Context Engineering track (Advanced Agentic AI program): NovaAssist course environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai==1.109.1",
    "tiktoken==0.14.0",
    "torch==2.14.1",
    "sentence-transformers==6.1.0",
    "transformers==5.20.1",
    "faiss-cpu==1.15.1",
    "rank-bm25==0.2.2",
    "qdrant-client==1.19.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "ragas==0.4.3",
    "langchain-community==0.3.31",
    "mcp==2.3.0",
    "neo4j==6.4.1",
    "pymupdf==2.0",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "matplotlib==3.11.2",
    "jupyterlab==4.6.4",
    "ipykernel==7.4.0",
]

[tool.uv]
package = false
# Windows (x64), Apple Silicon Macs, and Linux x64 for mentors. Intel Macs have no current torch wheels.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
